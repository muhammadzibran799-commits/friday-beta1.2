<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Friday</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    body {
      font-family: 'Lexend', sans-serif;
      background-color: #5a5a5a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
 
    .chat-card {
      width: 780px;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.38);
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }
 
    .chat-header {
      background: #ffffff;
      padding: 18px 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1.5px solid #e0e0e0;
      flex-shrink: 0;
    }
 
    .chat-header .title { font-size: 17px; font-weight: 500; color: #1a1a1a; letter-spacing: 0.01em; }
 
    .status-badge { display: flex; align-items: center; gap: 7px; }
    .status-dot { width: 11px; height: 11px; background-color: #5ecb6b; border-radius: 50%; flex-shrink: 0; }
    .status-text { font-size: 15px; font-weight: 400; color: #1a1a1a; }
 
    .chat-body {
      background: #e3e3e3;
      flex: 1;
      min-height: 430px;
      max-height: 430px;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
 
    .chat-body::-webkit-scrollbar { width: 5px; }
    .chat-body::-webkit-scrollbar-track { background: transparent; }
    .chat-body::-webkit-scrollbar-thumb { background: #bbb; border-radius: 10px; }
 
    .bubble-row { display: flex; width: 100%; }
    .bubble-row.user { justify-content: flex-end; }
    .bubble-row.ai { justify-content: flex-start; }
 
    .bubble {
      background: #ffffff;
      border-radius: 20px;
      padding: 12px 22px;
      font-size: 14px;
      font-weight: 400;
      color: #1a1a1a;
      line-height: 1.6;
      max-width: 75%;
      word-break: break-word;
    }
 
    .bubble p { margin-bottom: 8px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble ul, .bubble ol { padding-left: 20px; margin-bottom: 8px; }
    .bubble strong { font-weight: 600; }
    .bubble em { font-style: italic; }
 
    .bubble table { border-collapse: collapse; width: 100%; margin-top: 8px; }
    .bubble th, .bubble td { border: 1px solid #ddd; padding: 6px 10px; font-size: 13px; }
    .bubble th { background-color: #f0f0f0; font-weight: 500; }
 
    .bubble.typing span {
      display: inline-block;
      width: 6px; height: 6px;
      background: #999;
      border-radius: 50%;
      margin: 0 2px;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .bubble.typing span:nth-child(1) { animation-delay: 0s; }
    .bubble.typing span:nth-child(2) { animation-delay: 0.2s; }
    .bubble.typing span:nth-child(3) { animation-delay: 0.4s; }
 
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-6px); }
    }
 
    .chat-footer {
      background: #ffffff;
      padding: 16px 22px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
 
    .input-wrapper { flex: 1; position: relative; display: flex; align-items: center; }
 
    .chat-input {
      width: 100%;
      border: 1.5px solid #d0d0d0;
      border-radius: 50px;
      padding: 12px 52px 12px 22px;
      font-family: 'Lexend', sans-serif;
      font-size: 14px;
      font-weight: 300;
      color: #1a1a1a;
      background: #f4f4f4;
      outline: none;
      transition: border-color 0.2s;
      height: 46px;
      line-height: 1.4;
    }
 
    .chat-input:focus { border-color: #b0b0b0; background: #fff; }
    .chat-input::placeholder { color: #b0b0b0; font-weight: 300; }
 
    .send-btn {
      position: absolute;
      right: 5px;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: #2b2b2b;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
    }
 
    .send-btn:hover { background: #444; }
    .send-btn:active { transform: scale(0.93); }
    .send-btn:disabled { background: #999; cursor: not-allowed; }
    .send-btn svg { width: 17px; height: 17px; fill: #ffffff; }
  </style>
</head>
<body>
 
  <div class="chat-card">
    <div class="chat-header">
      <span class="title">Friday</span>
      <div class="status-badge">
        <div class="status-dot"></div>
        <span class="status-text">Online</span>
      </div>
    </div>
 
    <div class="chat-body" id="chatBody"></div>
 
    <div class="chat-footer">
      <input type="file" id="fileInput" accept=".pdf" style="display:none"
         onchange="uploadPDF(this)"/>
      <button onclick="document.getElementById('fileInput').click()"
              style="background:#f0f0f0; border:none; border-radius:50%; 
                    width:46px; height:46px; cursor:pointer; font-size:18px;">
        📎
      </button>
      <div class="input-wrapper">
        <input type="text" class="chat-input" id="chatInput" placeholder="Ketik pesan..." autocomplete="off"/>
        <button class="send-btn" id="sendBtn" onclick="kirimPesan()">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z" transform="rotate(-90 12 12)"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
 
  <script>
    const chatBody  = document.getElementById('chatBody');
    const chatInput = document.getElementById('chatInput');
    const sendBtn   = document.getElementById('sendBtn');
    let history     = [];
    let filePath    = null;
 
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); kirimPesan(); }
    });
 
    function tambahBubble(teks, role) {
      const row    = document.createElement('div');
      row.className = `bubble-row ${role}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
 
      if (role === 'ai') {
        bubble.innerHTML = marked.parse(teks);
      } else {
        bubble.textContent = teks;
      }
 
      row.appendChild(bubble);
      chatBody.appendChild(row);
      scrollBawah();
      return bubble;
    }
 
    function tampilLoading() {
      const row    = document.createElement('div');
      row.className = 'bubble-row ai';
      row.id        = 'loadingRow';
      const bubble = document.createElement('div');
      bubble.className = 'bubble typing';
      bubble.innerHTML = '<span></span><span></span><span></span>';
      row.appendChild(bubble);
      chatBody.appendChild(row);
      scrollBawah();
    }
 
    function hapusLoading() {
      const el = document.getElementById('loadingRow');
      if (el) el.remove();
    }
 
    function scrollBawah() {
      chatBody.scrollTop = chatBody.scrollHeight;
    }
    
    async function uploadPDF(input) {
      const file = input.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('file', file);

      tambahBubble(`📎 Mengupload ${file.name}...`, 'ai');

      try {
        const res = await fetch('https://branzz-friday-beta.hf.space/upload-pdf', {
          method: 'POST',
          body: formData
          // jangan tambah Content-Type — browser set otomatis untuk FormData
        });

        const data = await res.json();
          if (!res.ok) {
          tambahBubble('Gagal upload PDF. Coba lagi.', 'ai');
          return;
          }
          filePath = data.file_path;
          tambahBubble(`✅ ${file.name} berhasil diupload. Sekarang tanya apapun tentang dokumen ini.`, 'ai');

        tambahBubble(`✅ ${file.name} berhasil diupload. Sekarang tanya apapun tentang dokumen ini.`, 'ai');
      } catch (err) {
        tambahBubble('Gagal upload PDF.', 'ai');
      }
    }

    async function kirimPesan() {
      const teks = chatInput.value.trim();
      if (!teks) return;
 
      tambahBubble(teks, 'user');
      chatInput.value = '';
      sendBtn.disabled = true;
      tampilLoading();
 
      try {
        const res = await fetch('https://branzz-friday-beta.hf.space/chat', {
          method : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body   : JSON.stringify({ pesan: teks, history: history, file_path: filePath }),
        });
 
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
 
        const data = await res.json();
        hapusLoading();
        tambahBubble(data.jawaban, 'ai');
        history.push({"role": "user", "content": teks});
        history.push({"role": "assistant", "content": data.jawaban});
 
      } catch (err) {
        hapusLoading();
        tambahBubble('Koneksi ke Friday gagal. Pastikan server berjalan.', 'ai');
        console.error(err);
      } finally {
        sendBtn.disabled = false;
        chatInput.focus();
      }
    }
  </script>
 
</body>
</html>
